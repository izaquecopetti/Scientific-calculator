<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Calculadora Científica Profissional com funções trigonométricas, logarítmicas, memória e histórico de operações." />
  <meta name="theme-color" content="#0a0a0f" />
  <title>CalcPro — Calculadora Científica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-wrapper">

    <!-- ===== HEADER ===== -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">⟨/⟩</span>
        <span class="logo-text">CalcPro</span>
      </div>
      <div class="header-controls">
        <button class="icon-btn" id="toggleHistory" aria-label="Abrir histórico" title="Histórico">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </button>
        <button class="icon-btn" id="toggleKeyboard" aria-label="Atalhos de teclado" title="Atalhos">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="6" width="20" height="12" rx="2"/>
            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ===== MAIN LAYOUT ===== -->
    <main class="main-layout">

      <!-- HISTORY PANEL -->
      <aside class="history-panel" id="historyPanel" aria-label="Histórico de cálculos">
        <div class="panel-header">
          <h2>Histórico</h2>
          <button class="icon-btn danger-btn" id="clearHistory" title="Limpar histórico">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6m5 0V4h4v2"/>
            </svg>
          </button>
        </div>
        <ul class="history-list" id="historyList" aria-label="Lista de cálculos anteriores">
          <li class="history-empty">Nenhum cálculo ainda</li>
        </ul>
      </aside>

      <!-- CALCULATOR -->
      <section class="calculator" role="main" aria-label="Calculadora científica">

        <!-- DISPLAY -->
        <div class="display-wrapper">
          <div class="display-meta">
            <span class="angle-mode-badge" id="angleModeBadge">RAD</span>
            <div class="memory-indicators" id="memoryIndicators"></div>
          </div>
          <div class="display-expression" id="displayExpression" aria-label="Expressão atual"></div>
          <div class="display-result" id="displayResult" aria-live="polite" aria-label="Resultado">0</div>
          <button class="copy-btn" id="copyBtn" title="Copiar resultado" aria-label="Copiar resultado">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
            </svg>
          </button>
        </div>

        <!-- BUTTON GRID -->
        <div class="button-grid">

          <!-- ROW 1 — Memory & Mode -->
          <button class="btn btn-memory" data-action="mc" aria-label="Limpar memória">MC</button>
          <button class="btn btn-memory" data-action="mr" aria-label="Recuperar memória">MR</button>
          <button class="btn btn-memory" data-action="m-plus" aria-label="Somar à memória">M+</button>
          <button class="btn btn-memory" data-action="m-minus" aria-label="Subtrair da memória">M−</button>
          <button class="btn btn-mode" data-action="toggleAngle" id="angleModeBtn" aria-label="Alternar graus/radianos">DEG</button>

          <!-- ROW 2 — Scientific -->
          <button class="btn btn-sci" data-action="sin" aria-label="Seno">sin</button>
          <button class="btn btn-sci" data-action="cos" aria-label="Cosseno">cos</button>
          <button class="btn btn-sci" data-action="tan" aria-label="Tangente">tan</button>
          <button class="btn btn-sci" data-action="log" aria-label="Logaritmo base 10">log</button>
          <button class="btn btn-sci" data-action="ln" aria-label="Logaritmo natural">ln</button>

          <!-- ROW 3 — Scientific -->
          <button class="btn btn-sci" data-action="asin" aria-label="Arco seno">sin⁻¹</button>
          <button class="btn btn-sci" data-action="acos" aria-label="Arco cosseno">cos⁻¹</button>
          <button class="btn btn-sci" data-action="atan" aria-label="Arco tangente">tan⁻¹</button>
          <button class="btn btn-sci" data-action="pow" aria-label="Potência">xʸ</button>
          <button class="btn btn-sci" data-action="sqrt" aria-label="Raiz quadrada">√x</button>

          <!-- ROW 4 — Scientific -->
          <button class="btn btn-sci" data-action="cbrt" aria-label="Raiz cúbica">∛x</button>
          <button class="btn btn-sci" data-action="abs" aria-label="Valor absoluto">|x|</button>
          <button class="btn btn-sci" data-action="factorial" aria-label="Fatorial">x!</button>
          <button class="btn btn-sci" data-action="exp" aria-label="Exponencial">eˣ</button>
          <button class="btn btn-sci" data-action="pi" aria-label="Pi">π</button>

          <!-- ROW 5 — Controls -->
          <button class="btn btn-clear" data-action="ac" aria-label="Limpar tudo">AC</button>
          <button class="btn btn-clear-entry" data-action="backspace" aria-label="Apagar">⌫</button>
          <button class="btn btn-secondary" data-action="toggleSign" aria-label="Inverter sinal">+/−</button>
          <button class="btn btn-secondary" data-action="percent" aria-label="Porcentagem">%</button>
          <button class="btn btn-operator" data-action="operator" data-value="÷" aria-label="Dividir">÷</button>

          <!-- ROW 6 -->
          <button class="btn btn-digit" data-action="digit" data-value="7" aria-label="7">7</button>
          <button class="btn btn-digit" data-action="digit" data-value="8" aria-label="8">8</button>
          <button class="btn btn-digit" data-action="digit" data-value="9" aria-label="9">9</button>
          <button class="btn btn-sci" data-action="euler" aria-label="Número de Euler">e</button>
          <button class="btn btn-operator" data-action="operator" data-value="×" aria-label="Multiplicar">×</button>

          <!-- ROW 7 -->
          <button class="btn btn-digit" data-action="digit" data-value="4" aria-label="4">4</button>
          <button class="btn btn-digit" data-action="digit" data-value="5" aria-label="5">5</button>
          <button class="btn btn-digit" data-action="digit" data-value="6" aria-label="6">6</button>
          <button class="btn btn-sci btn-open-paren" data-action="paren-open" aria-label="Abre parêntese">(</button>
          <button class="btn btn-operator" data-action="operator" data-value="−" aria-label="Subtrair">−</button>

          <!-- ROW 8 -->
          <button class="btn btn-digit" data-action="digit" data-value="1" aria-label="1">1</button>
          <button class="btn btn-digit" data-action="digit" data-value="2" aria-label="2">2</button>
          <button class="btn btn-digit" data-action="digit" data-value="3" aria-label="3">3</button>
          <button class="btn btn-sci btn-close-paren" data-action="paren-close" aria-label="Fecha parêntese">)</button>
          <button class="btn btn-operator" data-action="operator" data-value="+" aria-label="Somar">+</button>

          <!-- ROW 9 -->
          <button class="btn btn-digit btn-zero" data-action="digit" data-value="0" aria-label="0">0</button>
          <button class="btn btn-digit" data-action="decimal" aria-label="Ponto decimal">.</button>
          <button class="btn btn-sci" data-action="square" aria-label="Elevar ao quadrado">x²</button>
          <button class="btn btn-equals" data-action="equals" aria-label="Calcular">=</button>

        </div>

      </section>
    </main>

    <!-- KEYBOARD SHORTCUTS MODAL -->
    <div class="modal-overlay" id="keyboardModal" role="dialog" aria-modal="true" aria-label="Atalhos de teclado">
      <div class="modal">
        <div class="modal-header">
          <h3>Atalhos de Teclado</h3>
          <button class="icon-btn" id="closeModal" aria-label="Fechar">×</button>
        </div>
        <div class="shortcuts-grid">
          <div class="shortcut"><kbd>0–9</kbd><span>Dígitos</span></div>
          <div class="shortcut"><kbd>+</kbd><span>Soma</span></div>
          <div class="shortcut"><kbd>-</kbd><span>Subtração</span></div>
          <div class="shortcut"><kbd>*</kbd><span>Multiplicação</span></div>
          <div class="shortcut"><kbd>/</kbd><span>Divisão</span></div>
          <div class="shortcut"><kbd>Enter</kbd><span>Calcular</span></div>
          <div class="shortcut"><kbd>Backspace</kbd><span>Apagar</span></div>
          <div class="shortcut"><kbd>Escape</kbd><span>Limpar tudo</span></div>
          <div class="shortcut"><kbd>.</kbd><span>Decimal</span></div>
          <div class="shortcut"><kbd>%</kbd><span>Porcentagem</span></div>
          <div class="shortcut"><kbd>(</kbd> <kbd>)</kbd><span>Parênteses</span></div>
          <div class="shortcut"><kbd>s</kbd><span>sin</span></div>
          <div class="shortcut"><kbd>c</kbd><span>cos</span></div>
          <div class="shortcut"><kbd>t</kbd><span>tan</span></div>
          <div class="shortcut"><kbd>l</kbd><span>log</span></div>
          <div class="shortcut"><kbd>n</kbd><span>ln</span></div>
          <div class="shortcut"><kbd>r</kbd><span>√x</span></div>
          <div class="shortcut"><kbd>p</kbd><span>π</span></div>
        </div>
      </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
